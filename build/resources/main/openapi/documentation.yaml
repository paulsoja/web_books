openapi: 3.0.3
info:
  title: Web Books API
  version: "1.2.0"
  description: |
    API для мобильного приложения "Спасіння".
    Включает авторизацию, работу с книгами, неделями, уроками и домашними заданиями.
    ⚠️ OTP сейчас замокан и всегда равен "1111".
    Для сброса пароля используйте /request-otp с purpose=PASSWORD_RESET.
servers:
  - url: https://web-books-1.onrender.com
    description: Render (prod)
  - url: http://localhost:8080
    description: Local dev

tags:
  - name: Auth
    description: Регистрация, подтверждение, логин/рефреш/логаут
  - name: Books
    description: Работа с книгами
  - name: Weeks
    description: Список недель книги
  - name: Lessons
    description: Список уроков недели
  - name: Homework
    description: Работа с домашними заданиями
  - name: Users
    description: Профиль текущего пользователя

paths:
  /register:
    post:
      tags: [Auth]
      summary: Регистрация
      description: |
        Создаёт пользователя со статусом `pending`.
        OTP-код для подтверждения всегда "1111" (пишется в лог).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              ok:
                value: { email: "user@example.com", password: "mypassword" }
      responses:
        '201':
          description: Пользователь создан
        '400':
          description: Ошибка (например, пользователь уже существует)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /request-otp:
    post:
      tags: [Auth]
      summary: Запрос OTP-кода на e-mail
      description: Отправляет код подтверждения на указанный email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestOtpRequest'
      responses:
        '204':
          description: Код отправлен (или email не найден, если политика безопасности скрывает это)
        '400':
          description: Ошибка валидации email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Слишком много запросов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /verify-otp:
    post:
      tags: [Auth]
      summary: Подтверждение e-mail по OTP (и мгновенная выдача токенов)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        '200':
          description: Успешно подтверждён. Возвращает access/refresh токены.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Неверный код или пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /reset-password:
    post:
      tags: [Auth]
      summary: Сброс пароля по OTP
      description: Устанавливает новый пароль, если передан верный OTP-код.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Пароль успешно изменён
        '400':
          description: Неверный код, истекший OTP или ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /login:
    post:
      tags: [Auth]
      summary: Логин по email и паролю
      description: Возвращает пару токенов (access/refresh).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              ok:
                value: { email: "user@example.com", password: "mypassword" }
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                ok:
                  value:
                    accessToken: "jwt-access"
                    accessExpiresAt: "2025-09-02T10:00:00Z"
                    refreshToken: "jwt-refresh"
                    refreshExpiresAt: "2025-09-09T10:00:00Z"
        '401':
          description: Неверные креденшлы или пользователь не активирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /refresh:
    post:
      tags: [Auth]
      summary: Обновление access/refresh токенов
      description: |
        Принимает refreshToken в теле, возвращает новую пару токенов.
        Старый refresh обычно помечается неактивным (ротация).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            examples:
              ok:
                value: { refreshToken: "jwt-refresh" }
      responses:
        '200':
          description: Новая пара токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Недействительный или истёкший refresh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /logout:
    post:
      tags: [Auth]
      summary: Логаут (ревокация refresh-токена)
      description: Аннулирует переданный refresh-токен.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            examples:
              ok:
                value: { refreshToken: "jwt-refresh" }
      responses:
        '204':
          description: Токен отозван (без тела)
        '400':
          description: Не удалось отозвать токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /books:
    get:
      tags: [Books]
      summary: Get list of books
      description: Returns all books. Requires valid JWT access token.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
        '401':
          description: Missing or invalid JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    message: "Unauthorized"

  /weeks/{bookId}:
    get:
      tags: [Weeks]
      summary: Получить список недель для книги
      parameters:
        - in: path
          name: bookId
          required: true
          schema:
            type: integer
            format: int64
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список недель
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Week'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Книга не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /lessons/{weekId}:
    get:
      tags: [Lessons]
      summary: Получить список уроков для недели
      parameters:
        - in: path
          name: weekId
          required: true
          schema:
            type: integer
            format: int64
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список уроков
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lesson'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Неделя не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me:
    get:
      tags: [Users]
      summary: Get current authenticated user
      description: Returns information about the current user. Requires a valid JWT access token.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              examples:
                sample:
                  value:
                    userId: 42
                    email: "alice@example.com"
                    role: "user"
                    firstName: "Alice"
                    lastName: "Johnson"
                    avatarUrl: "https://cdn.example.com/avatars/42.png"
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags: [ Users ]
      summary: Update current user profile
      description: Updates first and/or last name of the current user. Requires JWT.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
            examples:
              updateFirstName:
                value: { firstName: "Alice" }
              updateBoth:
                value: { firstName: "Alice", lastName: "Johnson" }
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '404':
          description: User not found

  /homework:
    get:
      tags: [Homework]
      summary: Получить статус выполнения ДЗ по всем книгам
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список статусов по книгам
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookHomeworkStatus'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /homework/{bookId}:
    get:
      tags: [Homework]
      summary: Получить статус выполнения ДЗ по всей книге
      parameters:
        - in: path
          name: bookId
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список статусов по неделям
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WeekHomeworkStatus'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /homework/{bookId}/weeks/{weekNumber}/lessons:
    get:
      tags: [Homework]
      summary: Получить список номеров уроков с выполненным ДЗ в конкретной неделе
      parameters:
        - in: path
          name: bookId
          required: true
          schema:
            type: string
        - in: path
          name: weekNumber
          required: true
          schema:
            type: integer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список номеров уроков
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /homework/{bookId}/weeks/{weekNumber}/lessons/{lessonNumber}:
    get:
      tags: [Homework]
      summary: Получить ответы пользователя на ДЗ в конкретном уроке
      parameters:
        - in: path
          name: bookId
          required: true
          schema:
            type: string
        - in: path
          name: weekNumber
          required: true
          schema:
            type: integer
        - in: path
          name: lessonNumber
          required: true
          schema:
            type: integer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ответы пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeworkResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Homework]
      summary: Сохранить/обновить ответы пользователя на ДЗ
      parameters:
        - in: path
          name: bookId
          required: true
          schema:
            type: string
        - in: path
          name: weekNumber
          required: true
          schema:
            type: integer
        - in: path
          name: lessonNumber
          required: true
          schema:
            type: integer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HomeworkRequest'
      responses:
        '200':
          description: Успешно сохранено. Возвращает обновлённый список номеров уроков с ДЗ в этой неделе.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /books/{id}/purchase:
    post:
      tags: [Purchases]
      summary: Mark a book as purchased (temporary)
      description: |
        Marks the specified book as purchased for the current user.
        Idempotent: if already purchased, returns 200.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
          description: Book ID
      responses:
        '200':
          description: Book marked as purchased
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResponse'
              examples:
                ok:
                  value: { bookId: 123, purchased: true }
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Book not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 6
          example: mypassword

    VerifyOtpRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        code:
          type: string
          description: Временно замокан — всегда "1111"
          example: "1111"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          example: mypassword

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: JWT refresh-токен из /login или /refresh

    TokenResponse:
      type: object
      required: [accessToken, accessExpiresAt, refreshToken, refreshExpiresAt]
      properties:
        accessToken:
          type: string
          description: JWT access
        accessExpiresAt:
          type: string
          format: date-time
          description: ISO-8601 время истечения access
        refreshToken:
          type: string
          description: JWT refresh
        refreshExpiresAt:
          type: string
          format: date-time
          description: ISO-8601 время истечения refresh

    Book:
      type: object
      required: [id, number, title, isPurchased]
      properties:
        id:
          type: integer
          format: int64
        number:
          type: string
        title:
          type: string
        subtitle:
          type: string
          nullable: true
        isPurchased:
          type: boolean

    UserProfile:
      type: object
      required: [userId, email, role]
      properties:
        userId:
          type: integer
          format: int64
          example: 42
        email:
          type: string
          format: email
          example: alice@example.com
        role:
          type: string
          example: user
        firstName:
          type: string
          example: Alice
        lastName:
          type: string
          example: Johnson
        avatarUrl:
          type: string
          format: uri
          example: https://cdn.example.com/avatars/42.png

    UpdateMeRequest:
      type: object
      properties:
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100

    PurchaseResponse:
      type: object
      required: [ bookId, purchased ]
      properties:
        bookId: { type: integer, format: int64, example: 123 }
        purchased: { type: boolean, example: true }

    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Something went wrong

    RequestOtpRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        purpose:
          type: string
          enum: [LOGIN, PASSWORD_RESET]
          default: LOGIN

    ResetPasswordRequest:
      type: object
      required: [email, code, newPassword]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
        newPassword:
          type: string
          minLength: 8

    Week:
      type: object
      required: [id, bookId, number, title]
      properties:
        id:
          type: integer
          format: int64
        bookId:
          type: integer
          format: int64
        number:
          type: integer
        title:
          type: string

    Lesson:
      type: object
      required: [id, weekId, number, title, content]
      properties:
        id:
          type: integer
          format: int64
        weekId:
          type: integer
          format: int64
        number:
          type: integer
        title:
          type: string
        quote:
          type: string
          nullable: true
        content:
          type: array
          items:
            $ref: '#/components/schemas/LessonContent'

    LessonContent:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: [text, image]
        data:
          type: string

    BookHomeworkStatus:
      type: object
      required: [bookId, completedLessons]
      properties:
        bookId:
          type: string
        completedLessons:
          type: integer

    WeekHomeworkStatus:
      type: object
      required: [week_number, completed]
      properties:
        week_number:
          type: integer
        completed:
          type: integer
          format: int64

    HomeworkResponse:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/HomeworkAnswer'

    HomeworkRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/HomeworkAnswer'

    HomeworkAnswer:
      type: object
      required: [questionId, values]
      properties:
        questionId:
          type: string
        values:
          type: array
          items:
            $ref: '#/components/schemas/HomeworkValue'

    HomeworkValue:
      type: object
      required: [id, answer]
      properties:
        id:
          type: string
        answer:
          type: string
